apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ssh-server
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  serviceName: ssh-server
  replicas: 1
  selector:
    matchLabels:
      app: ssh-server
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  template:
    metadata:
      labels:
        app: ssh-server
    spec:
      containers:
      - name: ssh
        image: niteesh20/amazonlinux-ssh:latest
        ports:
        - containerPort: 22
        - containerPort: 8501
        volumeMounts:
        - name: data
          mountPath: /data

---
apiVersion: v1
kind: Service
metadata:
  name: ssh-server
spec:
  type: NodePort
  selector:
    app: ssh-server
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 22
      nodePort: 30222

    - name: app
      protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30501
---
apiVersion: v1
kind: Namespace
metadata:
  name: ec2
