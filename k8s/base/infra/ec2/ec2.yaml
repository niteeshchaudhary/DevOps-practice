apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssh-server
  template:
    metadata:
      labels:
        app: ssh-server
    spec:
      containers:
      - name: ssh
        image: niteesh20/amazonlinux-ssh:latest
        ports:
        - containerPort: 22

---
apiVersion: v1
kind: Service
metadata:
  name: ssh-server
spec:
  type: NodePort
  selector:
    app: ssh-server
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
      nodePort: 30222

---
apiVersion: v1
kind: Namespace
metadata:
  name: ec2
